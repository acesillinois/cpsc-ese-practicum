name: Publish Notebooks to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install notebook tools
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert

      - name: Create Pages directory
        run: mkdir -p _site

      - name: Convert notebooks to HTML
        run: |
          python <<'PY'
          from pathlib import Path
          import subprocess

          root = Path(".")
          output_root = Path("_site")

          for notebook in root.rglob("*.ipynb"):

              if ".ipynb_checkpoints" in notebook.parts:
                  continue

              if ".git" in notebook.parts:
                  continue

              relative = notebook.relative_to(root)

              output_dir = output_root / relative.parent
              output_dir.mkdir(parents=True, exist_ok=True)

              print(f"Converting: {notebook}")

              subprocess.run([
                  "jupyter",
                  "nbconvert",
                  "--to", "html",
                  str(notebook),
                  "--output-dir", str(output_dir)
              ], check=True)
          PY

      - name: Create notebook index
        run: |
          python <<'PY'
          from pathlib import Path

          site = Path("_site")

          notebooks = sorted(site.rglob("*.html"))

          lines = [
              "<!DOCTYPE html>",
              "<html>",
              "<head>",
              '<meta charset="utf-8">',
              "<title>Course Notebooks</title>",
              "</head>",
              "<body>",
              "<h1>Course Notebooks</h1>",
              "<ul>"
          ]

          for notebook in notebooks:
              rel = notebook.relative_to(site)

              if rel.name == "index.html":
                  continue

              lines.append(
                  f'<li><a href="{rel.as_posix()}">{rel.with_suffix("")}</a></li>'
              )

          lines += [
              "</ul>",
              "</body>",
              "</html>"
          ]

          (site / "index.html").write_text(
              "\n".join(lines),
              encoding="utf-8"
          )
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
