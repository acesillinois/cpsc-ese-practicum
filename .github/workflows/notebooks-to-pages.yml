name: Publish Notebooks to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install notebook tools
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert

      - name: Create Pages directory
        run: mkdir -p _site

      - name: Convert notebooks to HTML
        run: |
          python <<'PY'
          from pathlib import Path
          import subprocess

          root = Path(".")
          output_root = Path("_site")

          for notebook in root.rglob("*.ipynb"):
              if ".ipynb_checkpoints" in notebook.parts:
                  continue

              if ".git" in notebook.parts:
                  continue

              if "_site" in notebook.parts:
                  continue

              relative = notebook.relative_to(root)

              output_dir = output_root / relative.parent
              output_dir.mkdir(parents=True, exist_ok=True)

              print(f"Converting: {notebook}")

              subprocess.run([
                  "jupyter",
                  "nbconvert",
                  "--to", "html",
                  str(notebook),
                  "--output-dir", str(output_dir)
              ], check=True)
          PY

      - name: Create notebook index
        run: |
          python <<'PY'
          from pathlib import Path
          from html import escape
          from urllib.parse import quote

          root = Path(".")
          site = Path("_site")

          GITHUB_ORG = "acesillinois"
          GITHUB_REPO = "cpsc-ese-practicum"
          BRANCH = "main"

          notebooks = sorted(root.rglob("*.ipynb"))

          lines = [
              "<!DOCTYPE html>",
              "<html>",
              "<head>",
              '<meta charset="utf-8">',
              '<meta name="viewport" content="width=device-width, initial-scale=1">',
              "<title>Course Notebooks</title>",
              "<style>",
              "body { font-family: Arial, sans-serif; max-width: 1000px; margin: 40px auto; padding: 0 20px; }",
              "h1 { margin-bottom: 30px; }",
              "ul { padding-left: 20px; }",
              "li { margin: 16px 0; line-height: 1.8; }",
              ".notebook-link { font-weight: 600; }",
              ".colab-button { margin-left: 12px; padding: 6px 11px; background: #f9ab00; color: #000; text-decoration: none; border-radius: 4px; font-size: 0.9em; white-space: nowrap; }",
              ".colab-button:hover { background: #e89d00; }",
              "</style>",
              "</head>",
              "<body>",
              "<h1>Course Notebooks</h1>",
              "<ul>",
          ]

          for notebook in notebooks:
              if ".ipynb_checkpoints" in notebook.parts:
                  continue

              if ".git" in notebook.parts:
                  continue

              if "_site" in notebook.parts:
                  continue

              rel = notebook.relative_to(root)

              html_path = rel.with_suffix(".html").as_posix()

              encoded_path = quote(
                  rel.as_posix(),
                  safe="/"
              )

              colab_url = (
                  "https://colab.research.google.com/github/"
                  f"{GITHUB_ORG}/{GITHUB_REPO}/blob/"
                  f"{BRANCH}/{encoded_path}"
              )

              display_name = escape(
                  rel.with_suffix("").as_posix()
              )

              lines.append(
                  "<li>"
                  f'<a class="notebook-link" href="{html_path}">'
                  f"{display_name}"
                  "</a>"
                  f'<a class="colab-button" href="{colab_url}" '
                  'target="_blank" rel="noopener noreferrer">'
                  "Open in Colab"
                  "</a>"
                  "</li>"
              )

          lines.extend([
              "</ul>",
              "</body>",
              "</html>",
          ])

          (site / "index.html").write_text(
              "\n".join(lines),
              encoding="utf-8"
          )
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
